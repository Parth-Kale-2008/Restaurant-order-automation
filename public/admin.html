<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0a0a0b" />
  <title>Platform Admin · Anand Palace</title>
  <!-- same type system as the guest menu and the reception dashboard -->
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root { --gold:#d4af37; --bg:#0a0a0b; --surface:#141416; --elev:#1e1e21; --muted:#9ca3af; --border:rgba(255,255,255,.08); --green:#2e8b57; --red:#c64e4e; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: Inter, system-ui, sans-serif; background: radial-gradient(800px 500px at 50% -10%, rgba(212,175,55,.10), transparent 60%), var(--bg); color: #f5f5f0; min-height: 100vh; padding: 24px; }
    h1, h2 { font-family: 'Playfair Display', Georgia, serif; }
    a { color: var(--gold); }
    button { font-family: inherit; cursor: pointer; border: none; }
    input { font-family: inherit; }
    .wrap { max-width: 920px; margin: 0 auto; }

    /* login */
    .login { min-height: 80vh; display: grid; place-items: center; }
    .login-card { background: var(--surface); border: 1px solid var(--border); border-radius: 24px; padding: 38px 32px; width: 100%; max-width: 380px; text-align: center; }
    .login-card .e { font-size: 52px; }
    .login-card h1 { color: var(--gold); letter-spacing: 2px; text-transform: uppercase; font-size: 24px; margin: 10px 0 4px; }
    .login-card .sub { color: var(--muted); font-size: 12px; letter-spacing: 3px; text-transform: uppercase; margin-bottom: 24px; }
    input { width: 100%; background: var(--elev); border: 1px solid var(--border); border-radius: 12px; padding: 13px 14px; color: #f5f5f0; font-size: 15px; outline: none; transition: .3s; }
    input:focus { border-color: var(--gold); }
    .btn { background: linear-gradient(135deg, var(--gold), #b8901f); color: #1a1408; font-weight: 700; border-radius: 12px; padding: 13px; font-size: 15px; width: 100%; margin-top: 14px; }
    .btn:active { transform: scale(.98); }
    .err { color: #ffb3b3; font-size: 13px; min-height: 18px; margin-top: 10px; }

    /* dashboard */
    .topbar { display: flex; align-items: center; gap: 14px; margin-bottom: 26px; }
    .topbar h1 { font-size: 22px; color: var(--gold); letter-spacing: 1px; }
    .topbar .sp { flex: 1; }
    .logout { background: var(--elev); color: #f5f5f0; border: 1px solid var(--border); border-radius: 99px; padding: 9px 18px; font-size: 13px; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; align-items: start; }
    @media (max-width: 760px) { .grid { grid-template-columns: 1fr; } }
    .panel { background: var(--surface); border: 1px solid var(--border); border-radius: 20px; padding: 22px; }
    .panel h2 { font-size: 18px; color: var(--gold); margin-bottom: 16px; }
    .field { display: flex; flex-direction: column; gap: 5px; margin-bottom: 12px; }
    .field span { font-size: 12px; color: var(--muted); font-weight: 600; }
    .rest { display: flex; align-items: center; gap: 12px; padding: 14px 0; border-bottom: 1px solid var(--border); }
    .rest:last-child { border-bottom: none; }
    .rest .info { flex: 1; }
    .rest .info b { font-size: 16px; }
    .rest .info small { display: block; color: var(--muted); font-size: 12px; margin-top: 3px; }
    .rest .links { display: flex; gap: 8px; flex-wrap: wrap; }
    .chip { background: var(--elev); border: 1px solid var(--border); border-radius: 99px; padding: 6px 12px; font-size: 12px; text-decoration: none; color: var(--gold); }
    .del { background: transparent; color: var(--red); border: 1px solid rgba(198,78,78,.4); border-radius: 99px; padding: 6px 12px; font-size: 12px; }
    .hint { color: var(--muted); font-size: 12px; margin-top: 6px; line-height: 1.5; }
    .ok { color: var(--green); font-size: 13px; min-height: 18px; margin-top: 6px; }

    /* ---- PHONE ERGONOMICS ----
       iOS zooms the page in when a focused field is under 16px and never zooms back,
       leaving the admin panning a too-wide layout by hand. The chips and Delete button
       were also 29-30px tall, under the ~44px a fingertip needs. */
    @media (max-width: 640px) {
      input, .btn { font-size: 16px; }
      .chip, .del, .logout { min-height: 40px; display: inline-flex; align-items: center; justify-content: center; }
      .rest { flex-wrap: wrap; gap: 10px; }
      .rest .info { min-width: 100%; }
    }
  </style>
</head>
<body>
  <div class="wrap" id="app"></div>

  <script>
    const $ = (id) => document.getElementById(id);
    const esc = (s) => String(s == null ? "" : s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
    async function api(path, opts = {}) {
      const res = await fetch(path, { method: opts.method || "GET", headers: { "Content-Type": "application/json" }, credentials: "same-origin", body: opts.body ? JSON.stringify(opts.body) : undefined });
      const data = await res.json().catch(() => ({}));
      if (!res.ok) { const e = new Error(data.error || "Error"); e.status = res.status; throw e; }
      return data;
    }

    function renderLogin(err = "") {
      $("app").innerHTML = `
        <div class="login"><div class="login-card">
          <div class="e">🛡️</div><h1>Platform Admin</h1><div class="sub">Restaurant control</div>
          <input id="pw" type="password" placeholder="Admin password" />
          <button class="btn" id="go">Sign In</button>
          <div class="err">${esc(err)}</div>
        </div></div>`;
      const submit = async () => {
        try { await api("/api/admin/login", { method: "POST", body: { password: $("pw").value } }); renderDash(); }
        catch (e) { renderLogin(e.message); }
      };
      $("go").onclick = submit;
      $("pw").addEventListener("keydown", (e) => e.key === "Enter" && submit());
      $("pw").focus();
    }

    async function renderDash() {
      let data = { restaurants: [] };
      try { data = await api("/api/admin/restaurants"); } catch (e) { if (e.status === 401) return renderLogin(); }
      $("app").innerHTML = `
        <div class="topbar"><span style="font-size:30px">🏰</span><h1>Restaurants</h1><span class="sp"></span><button class="logout" id="logout">Sign out</button></div>
        <div class="grid">
          <div class="panel">
            <h2>All restaurants (${data.restaurants.length})</h2>
            <div id="list"></div>
          </div>
          <div class="panel">
            <h2>+ Add a restaurant</h2>
            <div class="field"><span>Restaurant name *</span><input id="n-name" placeholder="e.g. Cafe Mocha" /></div>
            <div class="field"><span>Manager password * (min 4)</span><input id="n-pass" placeholder="staff login password" /></div>
            <div class="field"><span>Tagline</span><input id="n-tag" placeholder="Coffee & Bakes" /></div>
            <div class="field"><span>Number of tables</span><input id="n-tables" type="number" min="1" max="100" value="8" /></div>
            <button class="btn" id="create">Create restaurant</button>
            <div class="ok" id="created"></div>
            <div class="hint">A new restaurant starts with the default sample menu (editable in its manager dashboard) and its own QR codes.</div>
          </div>
        </div>`;
      $("logout").onclick = async () => { try { await api("/api/admin/logout", { method: "POST" }); } catch {} renderLogin(); };

      const list = $("list");
      list.innerHTML = data.restaurants.map((r) => `
        <div class="rest">
          <div class="info">
            <b>${esc(r.name)}</b>
            <small>${esc(r.slug)} · ${r.tables} tables · ${r.menuItems} dishes · ${r.orders} orders</small>
            <div class="links">
              <a class="chip" href="/r/${esc(r.slug)}/manager" target="_blank">Manager →</a>
              <a class="chip" href="/r/${esc(r.slug)}/manager" target="_blank">QR codes</a>
            </div>
          </div>
          <button class="del" data-slug="${esc(r.slug)}">Delete</button>
        </div>`).join("") || `<div class="hint">No restaurants yet.</div>`;

      list.querySelectorAll(".del").forEach((b) => {
        b.onclick = async () => {
          if (!confirm("Delete this restaurant and all its orders? This cannot be undone.")) return;
          try { await api("/api/admin/restaurants/" + b.dataset.slug, { method: "DELETE" }); renderDash(); }
          catch (e) { alert(e.message); }
        };
      });

      $("create").onclick = async () => {
        const body = {
          name: $("n-name").value, password: $("n-pass").value,
          tagline: $("n-tag").value, tableCount: parseInt($("n-tables").value, 10) || 8
        };
        try {
          const r = await api("/api/admin/restaurants", { method: "POST", body });
          $("created").textContent = "✅ Created · manager: " + r.managerUrl;
          setTimeout(renderDash, 1400);
        } catch (e) { $("created").style.color = "#ffb3b3"; $("created").textContent = "⚠️ " + e.message; }
      };
    }

    (async () => {
      try { await api("/api/admin/session"); renderDash(); } catch { renderLogin(); }
    })();
  </script>
</body>
</html>
