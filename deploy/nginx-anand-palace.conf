# nginx reverse proxy for Anand Palace.
# Install to /etc/nginx/sites-available/anand-palace, then symlink into sites-enabled.
#
# THE CRITICAL PART is the Upgrade/Connection header pair in `location /`.
# Without it nginx silently strips the WebSocket handshake, socket.io falls back to
# slow HTTP long-polling, and the "live" manager dashboard stops being live.

# Maps the Upgrade request header through to the backend.
# Yields "upgrade" for a WebSocket handshake and "" for a normal request.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream anand_palace {
    server 127.0.0.1:3000;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name _;            # certbot rewrites this to your domain

    # Guests scan QR codes on phones over mobile data. Keep payloads small.
    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;
    gzip_min_length 1024;

    # Menu photos can be chunky; allow a generous upload for admin image handling.
    client_max_body_size 12M;

    location / {
        proxy_pass http://anand_palace;
        proxy_http_version 1.1;

        # --- WebSocket upgrade: do not remove ---
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # server.js does app.set("trust proxy", 1) and reads these to know it is on https.
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_cache_bypass $http_upgrade;

        # socket.io holds connections open. The 60s default would cut the dashboard
        # loose every minute and force a reconnect storm.
        proxy_read_timeout  300s;
        proxy_send_timeout  300s;
    }
}
